# =============================================================================
# Rumis AI Lab – DGX Spark (Inferenz-Backend)
# =============================================================================
# Auf dem DGX Spark läuft ausschliesslich vLLM. Monitoring und Firewall werden
# ausserhalb dieses Hosts erledigt (separater Monitoring-Server, Palo Alto).
#
# Ein Modell zur Zeit, damit die GPU vollständig der Inferenz zur Verfügung
# steht. Modellwechsel: VLLM_MODEL in .env ändern und neu starten.
#
# Usage:
#   docker compose up -d
# =============================================================================

# Projektname explizit, damit er nicht vom Verzeichnisnamen abhängt (er
# bestimmt die Volume-Namen). Bewusst NICHT "backend": so kollidiert ein
# Start hier nie mit dem aktuell laufenden Live-Projekt "backend".
name: rumis-dgx

services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: rumis-vllm:latest
    container_name: vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    command: >
      --model ${VLLM_MODEL:-google/gemma-4-26b-a4b-it}
      --served-model-name ${VLLM_SERVED_MODEL_NAME:-gemma-4-26b-a4b-it}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  huggingface_cache:
