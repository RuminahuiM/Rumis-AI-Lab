# ─────────────────────────────────────────────────────────────────────────────
# PLACEHOLDER – replaced by scripts/init-ssl.sh on first deployment.
# See docs/aws-ssl-setup.md for step-by-step instructions.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt ACME challenge (needed even before SSL is configured)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "SSL not configured yet.\nRun:  bash scripts/init-ssl.sh\n";
        add_header Content-Type text/plain;
    }
}
