#cloud-config
package_update: true
packages:
  - nfs-common

runcmd:
  # Create NFS mount points
  - mkdir -p /mnt/nas/postgres /mnt/nas/openwebui /mnt/nas/n8n

  # Add NFS mounts to fstab
  - |
    echo "${nas_ip}:${nas_share_path}/postgres  /mnt/nas/postgres  nfs4 vers=4.1,soft,timeo=150,retrans=3 0 0" >> /etc/fstab
    echo "${nas_ip}:${nas_share_path}/openwebui /mnt/nas/openwebui nfs4 vers=4.1,soft,timeo=150,retrans=3 0 0" >> /etc/fstab
    echo "${nas_ip}:${nas_share_path}/n8n       /mnt/nas/n8n       nfs4 vers=4.1,soft,timeo=150,retrans=3 0 0" >> /etc/fstab
  - mount -a

  # Clone the repo
  - git clone https://github.com/RuminahuiM/Rumis-AI-Lab.git /opt/rumis-ai-lab
  - chown -R rumis:rumis /opt/rumis-ai-lab

  # Write .env
  - |
    cat > /opt/rumis-ai-lab/.env <<'ENVEOF'
    POSTGRES_USER=${postgres_user}
    POSTGRES_PASSWORD=${postgres_pass}
    VLLM_ENDPOINT=${vllm_endpoint}
    NAS_IP=${nas_ip}
    NAS_SHARE_PATH=${nas_share_path}
    OUI_DOMAIN=${oui_domain}
    N8N_DOMAIN=${n8n_domain}
    CERTBOT_EMAIL=${certbot_email}
    ENVEOF
  - chown rumis:rumis /opt/rumis-ai-lab/.env
  - chmod 600 /opt/rumis-ai-lab/.env

  # Bootstrap SSL and start services
  - cd /opt/rumis-ai-lab && bash scripts/init-ssl.sh
  - cd /opt/rumis-ai-lab && docker compose up -d
