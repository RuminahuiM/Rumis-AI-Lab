#cloud-config
package_update: true

disk_setup:
  /dev/sdb:
    table_type: gpt
    overwrite: false
  /dev/sdc:
    table_type: gpt
    overwrite: false

fs_setup:
  - filesystem: ext4
    device: /dev/sdb
    partition: auto
  - filesystem: ext4
    device: /dev/sdc
    partition: auto

mounts:
  - [/dev/sdb1, /mnt/openwebui, ext4, "defaults,noatime", "0", "2"]
  - [/dev/sdc1, /mnt/n8n, ext4, "defaults,noatime", "0", "2"]

runcmd:
  # Clone the repo
  - git clone https://github.com/RuminahuiM/Rumis-AI-Lab.git /opt/rumis-ai-lab
  - chown -R rumis:rumis /opt/rumis-ai-lab

  # Ensure mount point ownership
  - chown -R 1000:1000 /mnt/openwebui
  - chown -R 1000:1000 /mnt/n8n

  # Write .env
  - |
    cat > /opt/rumis-ai-lab/.env <<'ENVEOF'
    VLLM_ENDPOINT=${vllm_endpoint}
    AZURE_TENANT_ID=${azure_tenant_id}
    OAUTH_CLIENT_ID=${oauth_client_id}
    OAUTH_CLIENT_SECRET=${oauth_client_secret}
    OAUTH_CLIENT_ID_N8N=${oauth_client_id_n8n}
    OAUTH_CLIENT_SECRET_N8N=${oauth_client_secret_n8n}
    WEBUI_ADMIN_EMAIL=${webui_admin_email}
    WEBUI_ADMIN_PASSWORD=${webui_admin_password}
    LITELLM_MASTER_KEY=${litellm_master_key}
    ENVEOF
  - chown rumis:rumis /opt/rumis-ai-lab/.env
  - chmod 600 /opt/rumis-ai-lab/.env

  # Start services
  - cd /opt/rumis-ai-lab && docker compose up -d
