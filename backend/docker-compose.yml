# =============================================================================
# Rumis AI Lab – Backend (DGX Spark)
# =============================================================================
# Single VLLM instance serving one model at a time for maximum GPU utilization.
# To switch models: change VLLM_MODEL in .env and restart.
#
# Usage:
#   docker compose up -d
# =============================================================================

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
    command: >
      --model ${VLLM_MODEL:-google/gemma-4-27b-it}
      --quantization ${VLLM_QUANTIZATION:-nvfp4}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  huggingface_cache:
