###############################################################################
# LiteLLM Proxy Configuration
# ────────────────────────────
# Unified gateway for cloud APIs and the local VLLM backend on DGX Spark.
# API keys are injected via environment variables from docker-compose.
#
# After changes: docker compose restart litellm
###############################################################################

model_list:
  # ── VLLM (DGX Spark – local inference) ────────────────────────────────────
  - model_name: gemma-4-26b-a4b
    litellm_params:
      model: hosted_vllm/google/gemma-4-26b-a4b-it
      api_base: os.environ/VLLM_ENDPOINT
      api_key: sk-no-key-needed

  # ── Anthropic Claude ──────────────────────────────────────────────────────
  - model_name: claude-opus-4.6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4.6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus-4.5
    litellm_params:
      model: anthropic/claude-opus-4-5-20251124
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4.5
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4.5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── OpenAI ────────────────────────────────────────────────────────────────
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4-pro
    litellm_params:
      model: openai/gpt-5.4-pro
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.3-codex
    litellm_params:
      model: openai/gpt-5.3-codex
      api_key: os.environ/OPENAI_API_KEY

  # ── Google Gemini ─────────────────────────────────────────────────────────
  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: null
  drop_params: true
