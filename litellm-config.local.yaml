###############################################################################
# LiteLLM – Local Full Setup
# ──────────────────────────
# Used by docker-compose.local.yml and docker-compose.server.yml.
# Extends the base cloud model list with local Ollama and llama.cpp endpoints.
#
# After changes: docker compose restart litellm
# Last updated: March 2026
###############################################################################

model_list:
  # ── Anthropic Claude (current as of March 2026) ───────────────────────────
  # 4.6 family — latest generation
  - model_name: claude-opus-4.6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4.6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # 4.5 family
  - model_name: claude-opus-4.5
    litellm_params:
      model: anthropic/claude-opus-4-5-20251124
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4.5
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4.5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── OpenAI (current as of March 2026) ─────────────────────────────────────
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4-pro
    litellm_params:
      model: openai/gpt-5.4-pro
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.3-codex
    litellm_params:
      model: openai/gpt-5.3-codex
      api_key: os.environ/OPENAI_API_KEY

  # ── Google Gemini (current as of March 2026) ──────────────────────────────
  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ── Ollama (local) ────────────────────────────────────────────────────────
  # Models are pulled by ollama-init on first run (llama3.2:3b by default).
  # Pull more models with: docker exec ollama ollama pull <model>
  # See docs/managing-models.md for the full model management guide.
  - model_name: llama3.2:3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://ollama:11434

  # Add more Ollama models here as you pull them, e.g.:
  # - model_name: mistral
  #   litellm_params:
  #     model: ollama/mistral
  #     api_base: http://ollama:11434

  # ── llama.cpp (local GGUF) ────────────────────────────────────────────────
  # Model is downloaded by llamacpp-init on first run.
  # Change the model filename in llamacpp-start.sh and LLAMA_ARG_MODEL in the
  # compose file to swap models. See docs/managing-models.md.
  - model_name: gpt-oss-20b
    litellm_params:
      model: openai/gpt-oss-20b
      api_base: http://llamacpp:8080/v1
      api_key: sk-no-key-needed

  # Add more llamacpp instances here if you run multiple servers, e.g.:
  # - model_name: my-other-model
  #   litellm_params:
  #     model: openai/my-other-model
  #     api_base: http://llamacpp-2:8080/v1
  #     api_key: sk-no-key-needed

general_settings:
  master_key: null
  drop_params: true
