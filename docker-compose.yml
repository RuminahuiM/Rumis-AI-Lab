# =============================================================================
# Lite AWS Setup – cloud API models only, HTTPS via nginx + Let's Encrypt
# =============================================================================
# This is the default compose file for the Lite AWS deployment.
# For other setups, use:
#   Local Full (LAN):       docker compose -f docker-compose.local.yml up -d
#   Custom Hosted Server:   docker compose -f docker-compose.server.yml up -d
#   Hybrid AWS + GPU:       use this file with litellm-config.hybrid.yaml
#                           (see docs/setup-hybrid.md)
#
# First-time AWS setup: bash scripts/init-ssl.sh   (generates SSL certs)
# =============================================================================

services:
  # ─── Ollama ────────────────────────────────────────────────────────────────
  # Profile: local-models  →  only starts when you run:
  #   docker compose --profile local-models up -d
  # Requires a GPU-enabled host (nvidia-container-toolkit).
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    profiles: [local-models]
    ports:
      - "127.0.0.1:11434:11434"  # localhost-only; no auth → never expose publicly
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend-net

  # ─── Ollama bootstrap – pulls a starter model once ────────────────────────
  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    profiles: [local-models]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c '
        echo "Pulling llama3.2:3b ..."
        curl -sf http://ollama:11434/api/pull -d "{\"name\":\"llama3.2:3b\"}"
        echo "Done."
      '
    restart: "no"
    networks:
      - backend-net

  # ─── llama.cpp model downloader (runs once, then exits) ───────────────────
  # Profile: local-models  →  requires GPU host + HF_TOKEN for gated models.
  llamacpp-init:
    image: nvidia/cuda:12.4.0-runtime-ubuntu22.04
    container_name: llamacpp-init
    profiles: [local-models]
    volumes:
      - llamacpp_models:/models
      - ./llamacpp-start.sh:/start.sh:ro
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    entrypoint: ["bash", "/start.sh"]
    restart: "no"
    networks:
      - backend-net

  # ─── llama.cpp server (gpt-oss-20b) ──────────────────────────────────────
  # Profile: local-models  →  uses official CUDA image, requires GPU host.
  # To add another model: duplicate this service, change the name/port/model.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    restart: unless-stopped
    profiles: [local-models]
    ports:
      - "127.0.0.1:8081:8080"  # localhost-only; no auth → never expose publicly
    volumes:
      - llamacpp_models:/models:ro
    environment:
      LLAMA_ARG_MODEL: "/models/gpt-oss-20b-mxfp4.gguf"
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_CTX_SIZE: "0"
      LLAMA_ARG_N_GPU_LAYERS: "28"
      LLAMA_ARG_THREADS: "4"
      LLAMA_ARG_JINJA: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      llamacpp-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend-net

  # ─── TEMPLATE: add more llama.cpp models by duplicating the block above ──
  # llamacpp-glm5:
  #   image: ghcr.io/ggml-org/llama.cpp:server-cuda
  #   container_name: llamacpp-glm5
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8082:8080"
  #   volumes:
  #     - llamacpp_models:/models:ro
  #   environment:
  #     LLAMA_ARG_MODEL: "/models/your-glm5-model.gguf"
  #     LLAMA_ARG_HOST: "0.0.0.0"
  #     LLAMA_ARG_PORT: "8080"
  #     LLAMA_ARG_CTX_SIZE: "0"
  #     LLAMA_ARG_N_GPU_LAYERS: "28"
  #     LLAMA_ARG_THREADS: "4"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   depends_on:
  #     llamacpp-init:
  #       condition: service_completed_successfully
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 120s
  #   networks:
  #     - backend-net

  # ─── LiteLLM Proxy – translates Anthropic API → OpenAI-compatible ────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"  # localhost-only; no auth (internal network only)
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: >
      --config /app/config.yaml
      --host 0.0.0.0
      --port 4000
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-rumis-litellm-master}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend-net

  # ─── Open WebUI ───────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"  # localhost-only; public access via nginx HTTPS
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      # Cloud models go through LiteLLM (API keys in .env).
      # To add local models later: start with --profile local-models and add
      # endpoints here (e.g. "http://litellm:4000/v1;http://llamacpp:8080/v1").
      OPENAI_API_BASE_URLS: "http://litellm:4000/v1"
      OPENAI_API_KEYS: "sk-no-key-needed"
      # Ollama disabled by default – only needed with --profile local-models.
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"  # invite-only; admin adds users via Settings → Admin → Users
    depends_on:
      litellm:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - frontend-net
      - backend-net

  # ─── OpenClaw Gateway ──────────────────────────────────────────────────────
  # Personal AI agent. Requires one-time onboarding, see docs/openclaw-setup.md
  # Web UI: http://localhost:18789 (token-authenticated)
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.3.22
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ./openclaw/config:/home/node/.openclaw
      - ./openclaw/workspace:/home/node/.openclaw/workspace
    environment:
      NODE_ENV: production
    command:
      [
        "node", "dist/index.js", "gateway",
        "--bind", "lan",
        "--port", "18789",
      ]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend-net
      - backend-net

  # ─── n8n – workflow automation ────────────────────────────────────────────
  # Access: https://<N8N_DOMAIN>  (proxied by nginx after init-ssl.sh)
  # First run: complete setup wizard to create the admin account.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"  # localhost-only; public access via nginx HTTPS
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      N8N_HOST: "${N8N_DOMAIN:-localhost}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "https"
      WEBHOOK_URL: "https://${N8N_DOMAIN:-localhost}/"
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-Europe/Zurich}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - frontend-net
      - backend-net

  # ─── Nginx – SSL termination & reverse proxy ─────────────────────────────
  # Routes oui.<domain> → open-webui, oc.<domain> → openclaw-gateway,
  # and n8n.<domain> → n8n.
  # Config is generated by scripts/init-ssl.sh on first deployment.
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/auth:/etc/nginx/auth:ro   # htpasswd files for basic auth
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - open-webui
      - openclaw-gateway
      - n8n
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend-net

  # ─── Certbot – auto-renews Let's Encrypt certificates every 12 h ─────────
  # No internal network needed: only requires internet access (Let's Encrypt)
  # and the shared certbot volumes.
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── OpenClaw CLI (management, runs on-demand only) ───────────────────────
  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:2026.3.22
    container_name: openclaw-cli
    volumes:
      - ./openclaw/config:/home/node/.openclaw
      - ./openclaw/workspace:/home/node/.openclaw/workspace
    environment:
      NODE_ENV: production
      BROWSER: "echo"
    stdin_open: true
    tty: true
    entrypoint: ["node", "dist/index.js"]
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    profiles:
      - cli
    depends_on:
      openclaw-gateway:
        condition: service_healthy

volumes:
  ollama_data:
  openwebui_data:
  llamacpp_models:
  n8n_data:

networks:
  # Public-facing tier: nginx ↔ open-webui ↔ openclaw-gateway
  frontend-net:
    driver: bridge
  # Internal AI tier: webuis ↔ ollama / llamacpp / litellm
  # nginx cannot reach backend services directly
  backend-net:
    driver: bridge
