# =============================================================================
# Rumis AI Lab – Frontend Stack
# =============================================================================
# Runs on a vCenter-provisioned VM with dedicated VMDKs for persistent data.
# Access is via Azure Application Proxy (TLS + SSO handled by Azure AD).
#
# Backend (VLLM on DGX Spark) is deployed separately – see backend/.
# =============================================================================

services:
  # ─── LiteLLM Proxy – unified gateway for cloud + local models ─────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: >
      --config /app/config.yaml
      --host 0.0.0.0
      --port 4000
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      VLLM_ENDPOINT: "${VLLM_ENDPOINT:?Set VLLM_ENDPOINT in .env (e.g. http://192.168.1.200:8000/v1/)}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-rumis-litellm-master}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Open WebUI ───────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:8080"
    volumes:
      - /mnt/openwebui:/app/backend/data
    environment:
      OPENAI_API_BASE_URLS: "${OPENAI_API_BASE_URLS:-http://litellm:4000/v1}"
      OPENAI_API_KEYS: "sk-no-key-needed"
      WEBUI_AUTH: "true"
      WEBUI_ADMIN_EMAIL: "${WEBUI_ADMIN_EMAIL}"
      WEBUI_ADMIN_PASSWORD: "${WEBUI_ADMIN_PASSWORD}"
      # Make env vars authoritative — Open WebUI otherwise persists settings
      # to its SQLite DB on first launch and ignores subsequent env changes.
      ENABLE_PERSISTENT_CONFIG: "${ENABLE_PERSISTENT_CONFIG:-false}"
      # Auto-grant access to Azure-AD-authenticated users (gating happens at
      # the Enterprise Application "Users and groups" assignment).
      DEFAULT_USER_ROLE: "${DEFAULT_USER_ROLE:-user}"
      # Azure AD OIDC SSO
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_PROVIDER_NAME: "Azure AD"
      OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID:-}"
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET:-}"
      OPENID_PROVIDER_URL: "https://login.microsoftonline.com/${AZURE_TENANT_ID:-common}/v2.0/.well-known/openid-configuration"
      # Required behind a reverse proxy (Azure App Proxy) — the auto-detected
      # callback uses the internal hostname which Azure AD won't accept.
      OPENID_REDIRECT_URI: "${OPENID_REDIRECT_URI:?Set OPENID_REDIRECT_URI in .env (e.g. https://your-app.msappproxy.net/oauth/oidc/callback)}"
      OAUTH_SCOPES: "openid email profile"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── n8n – workflow automation ────────────────────────────────────────────
  # SSO via n8n-oidc community module (official SSO requires paid Enterprise).
  # See docs/sso-setup.md for Azure AD configuration.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "0.0.0.0:5678:5678"
    volumes:
      - /mnt/n8n:/home/node/.n8n
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "https"
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-Europe/Zurich}"
      N8N_LICENSE_ACTIVATION_KEY: "${N8N_LICENSE_KEY:-}"
      # n8n-oidc (community OIDC module)
      EXTERNAL_MODULES: "n8n-oidc"
      N8N_OIDC_CLIENT_ID: "${OAUTH_CLIENT_ID_N8N:-}"
      N8N_OIDC_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET_N8N:-}"
      N8N_OIDC_ISSUER: "https://login.microsoftonline.com/${AZURE_TENANT_ID:-common}/v2.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
